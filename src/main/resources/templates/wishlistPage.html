<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist — Artsy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/artsy.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/shop.css">
</head>
<body>

<div th:replace="~{appNav :: appNav('wishlist')}"></div>

<header class="page-header">
    <p class="page-label">SAVED FOR LATER</p>
    <h1>Your <em>wishlist.</em></h1>
    <p>The little treasures you've saved to come back to.</p>
</header>

<main class="shop-container" style="grid-template-columns: 1fr;">

    <section class="shop-content">

        <div class="shop-toolbar">
            <span class="results"><strong th:text="${#lists.size(items)}"></strong> saved items</span>
        </div>

        <div class="products">

            <article class="product-card" th:each="item : ${items}">
                <a th:href="@{'/product/' + ${item.product.id}}" class="product-card-link">
                    <div class="product-image">
                        <img th:if="${item.product.image != null}" th:src="${item.product.image}" style="width:100%; height:100%; object-fit:cover;" alt="">
                        <span th:if="${item.product.image == null}">🎨</span>
                    </div>
                    <div class="product-info">
                        <p class="product-category" th:text="${item.product.productType}"></p>
                        <h3 class="product-name" th:text="${item.product.title}"></h3>
                        <div class="product-bottom">
                            <span class="price" th:text="'Rs. ' + ${item.product.price}"></span>
                            <span class="seller" th:text="${item.product.vendor != null and item.product.vendor.shopName != null} ? ${item.product.vendor.shopName} : ''"></span>
                        </div>
                    </div>
                </a>
                <form th:action="@{'/wishlist/remove/' + ${item.id}}" method="post" style="display:contents;">
                    <button type="submit" class="heart liked" title="Remove from wishlist">♥</button>
                </form>
            </article>

            <div class="empty-shop" th:if="${#lists.isEmpty(items)}">
                Nothing saved yet — tap the heart on any product to add it here.
            </div>

        </div>

    </section>

</main>

<div th:replace="~{appFooter :: appFooter}"></div>

</body>
</html>
