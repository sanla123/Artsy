<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Artsy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/artsy.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div th:replace="~{authNav}"></div>

<main class="auth-wrapper">

    <section class="auth-art">
        <div class="blob auth-blob-one"></div>
        <div class="blob auth-blob-two"></div>

        <div class="auth-art-content">
            <p class="small-label">FORGOT SOMETHING?</p>
            <h1>It happens to <em>everyone.</em></h1>
            <p>Enter your email and we'll send you a new temporary password.</p>

        </div>

        <span class="auth-deco auth-star star-one">✦</span>
        <span class="auth-deco auth-star star-two">✧</span>
        <span class="auth-deco auth-star star-three">✦</span>
        <span class="auth-deco auth-star star-four">✧</span>

        <span class="auth-deco auth-flower flower-one">✿</span>
        <span class="auth-deco auth-flower flower-two">❀</span>
        <span class="auth-deco auth-flower flower-three">✿</span>
        <span class="auth-deco auth-flower flower-four">❀</span>

        <span class="auth-flower-large">✿</span>
        <span class="auth-flower-large-two">❀</span>
    </section>

    <section class="auth-form-area">
        <div class="auth-form">

            <div class="form-heading">
                <h2>Reset your password</h2>
                <p>Remembered it after all? <a href="/login">Back to login</a></p>
            </div>

            <p class="auth-message" style="color:#c0392b" th:if="${error}" th:text="${error}"></p>

            <form action="/forgot-password" method="post">

                <div class="form-group">
                    <label for="username">Your username</label>
                    <input type="text" id="username" name="username" placeholder="Your username" required>
                </div>

                <div class="form-group">
                    <label for="email">Your account email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <button type="submit" class="auth-submit">Send new password</button>
            </form>

            <p class="auth-note">✦ Check your inbox after submitting.</p>
        </div>
    </section>

</main>

</body>
</html>
