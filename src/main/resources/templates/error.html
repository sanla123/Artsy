<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong — Artsy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/artsy.css">
    <link rel="stylesheet" href="/css/home.css">

    <style>
        .error-wrap {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 96px;
            color: #c98a92;
            line-height: 1;
            margin-bottom: 10px;
        }
        .error-title { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 10px; }
        .error-message { color: #8d827e; max-width: 460px; margin-bottom: 30px; }
        .error-home-btn {
            background: #1a1a1a; color: #fff; padding: 14px 30px; border-radius: 30px;
            text-decoration: none; font-weight: 600; font-size: 14px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/home" class="logo"><img src="/images/artsy-logo.png" alt="Artsy" style="height:40px; width:auto; display:block;"></a>
</nav>

<div class="error-wrap">
    <div class="error-code" th:text="${status != null} ? ${status} : '404'"></div>
    <h1 class="error-title"
        th:text="${status != null and status == 404} ? 'This page wandered off.' : 'Something went wrong.'"></h1>
    <p class="error-message"
       th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'We couldn\'t complete that request. Let\'s get you back on track.'"></p>
    <a href="/home" class="error-home-btn">Back to Home</a>
</div>

</body>
</html>
