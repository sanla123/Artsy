<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Artsy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="css/artsy.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/homeFeed.css">

</head>
<body>

<div th:replace="~{appNav :: appNav('home')}"></div>


<main class="home-feed">


  <section class="top">
    <div>
      <h1>Find something<br><em>you'll love.</em></h1>
      <p>Ideas, handmade pieces, creative supplies and little things worth saving — all in one place.</p>
    </div>

  </section>

  <div class="chips">
    <a class="chip" href="/home">For you</a>
    <a class="chip" href="/shop?category=physical">Handmade</a>
    <a class="chip" href="/shop?category=supply">Craft supplies</a>
    <a class="chip" href="/shop?category=digital">Digital</a>
  </div>


  <div class="feed-title">
    <h2>Made &amp; found on Artsy</h2>
    <span></span>
  </div>

  <div class="feed" th:if="${not #lists.isEmpty(products)}">

    <article class="pin" th:each="product : ${products}">

      <div class="pin-image">
        <a th:href="@{'/product/' + ${product.id}}">
          <img th:if="${product.image != null}" th:src="${product.image}" th:alt="${product.title}">
          <div class="pin-noimg" th:if="${product.image == null}">🎨</div>
        </a>
      </div>

      <a th:href="@{'/product/' + ${product.id}}" class="pin-caption">
        <div class="pin-title" th:text="${product.title}"></div>
        <div class="pin-sub" th:text="(${product.category != null} ? ${product.category.categoryName} : ${product.productType}) + ' · Rs. ' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')}"></div>

      </a>

    </article>

  </div>

  <div class="feed-empty" th:if="${#lists.isEmpty(products)}">
    No products yet — check back soon!
  </div>


</main>


<div th:replace="~{appFooter :: appFooter}"></div>

</body>
</html>
